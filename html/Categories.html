          <div class="categories-title">
            <h3>Electronics</h3>
            <span
              >Latest gadgets, smart devices and more. Stay tunned, stay
              ahead</span
            >
          </div>
        </div>
        <div class="categories-img">
          <!-- <img src="https://gameloot.in/wp-content/uploads/sites/2/2025/10/Samsung-Laptop.jpg" alt=""> -->
        </div>
      </div>

      <section class="category-products">
        <!-- LEFT: Filter Sidebar -->
        <aside class="filter-sidebar">
          <div class="filter-header">
            <h2>Filters</h2>
            <button id="clearFilters" type="button">Clear All</button>
          </div>

          <!-- Price Range -->
          <div class="filter-group">
            <h3>Price Range</h3>
            <input
              type="number"
              id="minPrice"
              placeholder="Min price"
              min="0"
            />
            <input
              type="number"
              id="maxPrice"
              placeholder="Max price"
              min="0"
            />
          </div>

          <!-- Customer Rating -->
          <div class="filter-group">
            <h3>Customer Rating</h3>
            <select id="ratingFilter">
              <option value="all">All Ratings</option>
              <option value="4">4★ & above</option>
              <option value="3">3★ & above</option>
              <option value="2">2★ & above</option>
            </select>
          </div>

          <!-- Availability -->
          <div class="filter-group">
            <h3>Availability</h3>
            <label class="stock-option">
              <input type="checkbox" id="inStock" />
              In Stock Only
            </label>
          </div>
        </aside>

        <!-- RIGHT: Products Section -->
        <div class="products-section">
          <div class="products-toolbar">
            <p id="productCount">Showing products <span></span> </p>

            <div class="toolbar-actions">
              <select id="sortProducts">
                <option value="default">Featured</option>
                <option value="low-high">Price: Low to High</option>
                <option value="high-low">Price: High to Low</option>
                <option value="rating">Top Rated</option>
                <option value="name">Name: A to Z</option>
              </select>

              
            </div>
          </div>

          <div id="activeFilters" class="active-filters"></div>

          <!-- JavaScript will render product cards here -->
          
<div class="products-grid" id="productsGrid">
