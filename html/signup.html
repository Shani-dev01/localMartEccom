<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/auth.css" />
    <title>Document</title>
  </head>
  <body>
      
    <header class="navbar"></header>
    <section class="signup-auth-box">
      <!-- LEFT SIDE: FORM SECTION -->
      <div class="auth-form-section">
        <div class="auth-heading">
          <div class="auth-bagde-heading">
            <!-- Join Us Badge -->
            <span class="welcome-badge">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <line x1="19" y1="8" x2="19" y2="14" />
                <line x1="22" y1="11" x2="16" y2="11" />
              </svg>
              Join Us
            </span>
          </div>
          <div class="auth-heading-para">
            <div>
              <span class="login-title">Create </span>
              <span class="login-title2">Your Account</span>
            </div>
            <!-- Updated Paragraph -->
            <p>
              Get access to exclusive offers, faster checkout and a personalized
              shopping experience.
            </p>
          </div>
        </div>

        <form action="#" class="signup-form">
          <div class="auth-inputs-container">
            <!-- 1. Full Name -->
            <div class="auth-input-group">
              <p>Full Name*</p>
              <div class="auth-input-wrapper">
                <svg
                  class="auth-input-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
                <input
                  class="name-input"
                  type="text"
                  placeholder="Enter your full name"
                  required
                />
              </div>
            </div>

            <!-- 2. Email Address -->
            <div class="auth-input-group">
              <p>Email Address*</p>
              <div class="auth-input-wrapper">
                <svg
                  class="auth-input-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect width="20" height="16" x="2" y="4" rx="2" />
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                </svg>
                <input
                  class="email-input"
                  type="email"
                  placeholder="Enter your email address"
                  required
                />
              </div>
            </div>

            <!-- 3. Phone Number -->
            <div class="auth-input-group">
              <p>Phone Number*</p>
              <div class="auth-input-wrapper">
                <svg
                  class="auth-input-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
                  />
                </svg>
                <input
                  class="phone-nummber-input"
                  type="tel"
                  placeholder="Enter your phone number"
                  required
                />
              </div>
            </div>

            <!-- 4. Password -->
            <div class="auth-input-group">
              <p>Password*</p>
              <div class="auth-input-wrapper">
                <svg
                  class="auth-input-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="11" width="18" height="11" rx="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <input
                  class="password-input"
                  type="password"
                  placeholder="Create a password"
                  required
                />
              </div>
            </div>

            <!-- 5. Confirm Password -->
            <div class="auth-input-group">
              <p>Confirm Password*</p>
              <div class="auth-input-wrapper">
                <svg
                  class="auth-input-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="11" width="18" height="11" rx="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <input
                  class="confirm-password-input"
                  type="password"
                  placeholder="Confirm your password"
                  required
                />
              </div>
            </div>
          </div>

          <!-- Terms & Conditions Checkbox -->
          <div class="auth-chekbox">
            <div class="auth-title terms-title">
              <input class="terms-input" type="checkbox" id="terms" required />
              <label for="terms"
                >I agree to the <a href="#">Terms & Conditions</a> and
                <a href="#">Privacy Policy</a></label
              >
            </div>
          </div>

          <!-- Create Account Button -->
          <div class="auth-login-btn">
            <button type="submit">Create Account</button>
          </div>
        </form>

        <div class="auth-divider">
          <span class="auth-divider-line1"></span>
          <p>OR</p>
          <span class="auth-divider-line2"></span>
        </div>

        <!-- Go to Login Button -->
        <div class="auth-signup-btn">
          <button type="button" onclick="window.location.href = 'login.html'">
            Already have an account? Login
          </button>
        </div>
      </div>

      <!-- RIGHT SIDE: IMAGE SECTION -->
      <div class="auth-image-section">
        <div class="promo-text">
          <h3>More than just shopping</h3>
          <p>
            Be a part of our growing community and enjoy a seamless shopping
            experience.
          </p>
        </div>
        <img
          src="https://png.pngtree.com/png-vector/20240614/ourmid/pngtree-photo-of-grocery-shopping-cart-full-food-items-isolated-on-a-png-image_12597117.png"
          alt="Shopping Cart"
          class="promo-img"
        />
      </div>
    </section>

    <footer class="footer"></footer>

    <script src="../js/navbar.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
